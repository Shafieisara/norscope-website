<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0066cc" />
  <meta name="description" content="Sara Sarvestani — Mitgründerin, Norscope" />
  <title>Sara Sarvestani · Norscope</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #0066cc;
      --brand-rgb: 0, 102, 204;
      --ink: #0c1a2e;
      --muted: #5a6b7d;
      --line: rgba(0, 102, 204, 0.14);
      --surface: rgba(255, 255, 255, 0.72);
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 60% at 50% -15%, rgba(var(--brand-rgb), 0.22), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(var(--brand-rgb), 0.1), transparent 50%),
        linear-gradient(180deg, #e8f1fb 0%, #f7f9fc 45%, #eef3f9 100%);
      display: grid;
      place-items: center;
      padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    }

    .stage {
      width: min(100%, 26rem);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes photo-in {
      from { opacity: 0; transform: scale(1.04); }
      to { opacity: 1; transform: none; }
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      animation: fade-up 0.6s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand img {
      width: 7.5rem;
      height: auto;
      display: block;
    }

    .hero {
      position: relative;
      border-radius: 1.35rem;
      overflow: hidden;
      aspect-ratio: 4 / 5;
      max-height: min(52vh, 28rem);
      box-shadow:
        0 24px 48px rgba(12, 26, 46, 0.14),
        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      animation: photo-in 0.9s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70% center;
      display: block;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 48%,
        rgba(12, 26, 46, 0.55) 78%,
        rgba(12, 26, 46, 0.82) 100%
      );
      pointer-events: none;
    }

    .identity {
      position: absolute;
      left: 1.15rem;
      right: 1.15rem;
      bottom: 1.15rem;
      z-index: 1;
      color: var(--white);
      animation: fade-up 0.65s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .identity h1 {
      font-family: "Sora", sans-serif;
      font-size: clamp(1.55rem, 5.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
    }

    .identity .role {
      margin-top: 0.4rem;
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.92);
    }

    .identity .company {
      margin-top: 0.2rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #9ec5f5;
    }

    .actions {
      margin-top: 1.15rem;
      display: grid;
      gap: 0.55rem;
      animation: fade-up 0.65s 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 3rem;
      padding: 0.75rem 1rem;
      border-radius: 0.85rem;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--brand);
      color: var(--white);
      box-shadow: 0 10px 24px rgba(var(--brand-rgb), 0.28);
    }

    .btn-primary:hover {
      background: #0057b0;
      box-shadow: 0 12px 28px rgba(var(--brand-rgb), 0.34);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .btn-ghost:hover {
      background: #fff;
      border-color: rgba(var(--brand-rgb), 0.28);
    }

    .links {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      animation: fade-up 0.65s 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      position: relative;
      padding-bottom: 0.15rem;
    }

    .links a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.5px;
      background: var(--brand);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.22s ease;
    }

    .links a:hover { color: var(--brand); }
    .links a:hover::after { transform: scaleX(1); }

    .icon {
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="brand">
      <img src="/sara/assets/norscope-logo.png" alt="Norscope" width="346" height="163" />
    </div>

    <section class="hero" aria-label="Profilfoto">
      <img src="/sara/assets/sara.png" alt="Sara Sarvestani" width="800" height="1000" />
      <div class="identity">
        <h1>Sara Sarvestani</h1>
        <p class="role">Mitgründerin | Geschäftsentwicklung &amp; Vertrieb</p>
        <p class="company">Norscope</p>
      </div>
    </section>

    <div class="actions">
      <a class="btn btn-primary" href="/sara/sara-sarvestani.vcf" download="Sara-Sarvestani.vcf">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Kontakt speichern
      </a>
      <div class="btn-row">
        <a class="btn btn-ghost" href="tel:+4915252993422">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6.6 3.8c.5-.5 1.3-.5 1.7 0l1.8 1.8c.4.4.5 1.1.2 1.6L9.2 9.4a12.3 12.3 0 0 0 5.4 5.4l2.2-1.1c.5-.3 1.2-.2 1.6.2l1.8 1.8c.5.5.5 1.3 0 1.7l-1.3 1.3c-.5.5-1.2.7-1.9.5C10.4 17.4 6.6 13.6 4.8 8c-.2-.7 0-1.4.5-1.9l1.3-1.3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          Anrufen
        </a>
        <a class="btn btn-ghost" href="mailto:contact@norscope.com">
          <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5v-9Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="m5 8 7 5 7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          E-Mail
        </a>
      </div>
    </div>

    <nav class="links" aria-label="Links">
      <a href="https://www.linkedin.com/in/placeholder" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://www.norscope.com/" rel="noopener noreferrer">Website</a>
    </nav>
  </main>
</body>
</html>
